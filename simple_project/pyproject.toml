[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple_project"
version = "0.1.0"
description = "Demo project showing beacon_kit sidecar integration with minimal code changes"
requires-python = ">=3.11"
dependencies = [
    "beacon_kit",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["simple_project*"]
